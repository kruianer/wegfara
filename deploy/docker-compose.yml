# wegfara — eine Umgebung (dev oder prod) je Compose-Projekt.
#
# Aufruf auf dem Beelink (siehe delivery/devops.md):
#   dev:  docker compose -p wegfara-dev  --env-file ~/wegfara-env/dev.env  \
#           -f deploy/docker-compose.yml up -d --build
#   prod: docker compose -p wegfara-prod --env-file ~/wegfara-env/prod.env \
#           -f deploy/docker-compose.yml up -d --build
#
# APP_PORT und DATA_DIR kommen aus der jeweiligen env-Datei.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Bewusst keine Portfreigabe: die DB ist nur im Compose-Netz erreichbar
    # und nie aus dem Internet (siehe delivery/security.md).

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${DATABASE_URL}
      IMAGE_DIR: ${IMAGE_DIR}
      # Seit req-028 zusaetzlich die Quelle, aus der der Schluessel zum
      # Ver- und Entschluesseln der Zugangsschluessel je Account abgeleitet
      # wird (siehe lib/secrets/encryption.ts). Er steht bewusst hier und
      # nicht in der Datenbank -- sonst liesse sich ein Backup allein
      # auswerten. Wird er ausgetauscht, sind die hinterlegten
      # Zugangsschluessel neu zu setzen.
      AUTH_SECRET: ${AUTH_SECRET}
      # Der Schluessel fuer Dienste ohne Account-Bezug (req-028,
      # Constraints). Die KI-Suche eines Accounts (req-014) nutzt ihn nicht
      # mehr -- sie rechnet ueber den Schluessel ab, den der Account unter
      # "Einstellungen" hinterlegt hat.
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Optional, siehe lib/ai/openai-client.ts: leer laesst den Default gelten.
      OPENAI_MODEL: ${OPENAI_MODEL}
      # GOOGLE_PLACES_API_KEY entfaellt seit req-028: der Zugangsschluessel
      # fuer den Import aus einem Google-Maps-Link (req-026) wird je Account
      # in der Anwendung hinterlegt, nicht mehr je Umgebung.
      # Bindet den Passkey an die Domain der Umgebung und baut den
      # Anmeldelink (siehe lib/auth/webauthn-config.ts, req-016).
      APP_URL: ${APP_URL}
      # SMTP-Postfach bei All-Inkl fuer den Anmeldelink (req-016). Die
      # Zugangsdaten stehen ausschliesslich in der env-Datei der Umgebung.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    volumes:
      # Bilddateien liegen ausserhalb des Containers auf dem Host,
      # damit sie Neustarts und Deploys ueberleben.
      - ${DATA_DIR}/images:/data/images
    ports:
      # Nur lokal gebunden — von aussen erreichbar ausschliesslich
      # ueber den Cloudflare Tunnel.
      - "127.0.0.1:${APP_PORT}:3000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - app
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  db-data:
