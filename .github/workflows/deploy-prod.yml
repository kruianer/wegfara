# prod deployt NIE automatisch — ausschliesslich manuell ausgeloest
# und nur auf ausdrueckliche Zustimmung des Nutzers.
# Bewusst KEIN push-Trigger (siehe delivery/devops.md).
name: Deploy prod

on:
  workflow_dispatch:
    inputs:
      bestaetigung:
        description: 'Zum Bestaetigen "deploy" eintippen'
        required: true
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, wegfara]
    steps:
      - name: Bestaetigung pruefen
        run: |
          if [ "${{ inputs.bestaetigung }}" != "deploy" ]; then
            echo "Abgebrochen: Bestaetigung fehlt oder falsch."
            exit 1
          fi

      - uses: actions/checkout@v4

      # Das Quality-Gate vor der Promotion (siehe delivery/devops.md):
      # erst wenn beide Test-Ebenen gruen sind, wird ueberhaupt gesichert
      # und deployt.
      - name: Abhaengigkeiten
        run: npm ci

      - name: Test-Suite
        run: npm test

      - name: Browser fuer die E2E-Tests
        run: npx playwright install chromium

      - name: E2E-Tests im echten Browser
        run: npm run test:e2e

      # Gesichert wird ueber die Funktion der Anwendung und nicht ueber ein
      # eigenes Skript (req-053): dieselbe Funktion, die der Gesamt-Admin in
      # der "Verwaltung" ausloest, sichert DB und Bilddateien in einem Lauf --
      # nur so passen beide Haelften zueinander, und nur so laesst sich das
      # Ergebnis in der Anwendung wieder einspielen.
      #
      # Angesprochen wird die laufende prod-Instanz auf ihrem lokalen Port.
      # Weil dabei niemand angemeldet ist, weist sich der Deploy mit dem
      # AUTH_SECRET der Umgebung aus; das Backup traegt dann die Herkunft
      # "vor Deploy".
      - name: Backup vor dem Deploy
        run: |
          set -e
          set -a
          . "$HOME/wegfara-env/prod.env"
          set +a
          curl -fsS --max-time 900 -X POST \
            -H "x-wegfara-deploy: $AUTH_SECRET" \
            "http://127.0.0.1:${APP_PORT}/api/backups" > /dev/null
          echo "Backup ueber die Anwendung erstellt (~/wegfara-backups/)."

      - name: Deploy
        run: |
          docker compose -p wegfara-prod \
            --env-file "$HOME/wegfara-env/prod.env" \
            -f deploy/docker-compose.yml \
            up -d --build --remove-orphans

      - name: Aufraeumen
        run: docker image prune -f

      - name: Status
        run: docker compose -p wegfara-prod -f deploy/docker-compose.yml ps
